events {}

http {
    server {
        listen 81;
        server_name localhost;

        location / {
            fastcgi_pass 127.0.0.1:8080;   # передаём запросы нашему FCGI‑серверу
            include /etc/nginx/fastcgi_params;
        }

        location /status {
            stub_status;
        }
    }
}