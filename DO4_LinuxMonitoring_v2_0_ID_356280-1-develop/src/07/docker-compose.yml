services:
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/metrics || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 2s
    #ports:
    #  - "9100:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    network_mode: host
    restart: unless-stopped
    volumes:
      - './prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - 'prometheus-data:/prometheus'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 2s
    depends_on:
      node_exporter:
        condition: service_healthy
    #ports:
    #  - "9090:9090"

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    restart: unless-stopped
    network_mode: host
    volumes:
      - 'grafana-data:/var/lib/grafana'
    depends_on:
      prometheus:
        condition: service_healthy
    #ports:
    #  - "3000:3000"

volumes:
  prometheus-data: {}
  grafana-data: {}
